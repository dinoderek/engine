name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA; Dependabot bumps them (docs/versions.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go from go.mod's toolchain line, the same one ./dev pins.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The tmux tests skip without tmux, and CI must never skip.
      - name: Install tmux if the runner lacks it
        run: command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
      # The dashboard's browser-script tests skip without node.
      - name: Install node if the runner lacks it
        run: command -v node >/dev/null || (sudo apt-get update && sudo apt-get install -y nodejs)
      # The dashboard's browser test skips without a Chromium-family browser;
      # the runner image ships Chromium and Google Chrome. This prints the one
      # the test drives: the first of its candidates on PATH.
      - name: Require a Chromium browser
        run: |
          for b in chromium chromium-browser google-chrome google-chrome-stable microsoft-edge; do
            if command -v "$b" >/dev/null; then command -v "$b"; "$b" --version; exit 0; fi
          done
          exit 1
      - name: Install sqlite3 if the runner lacks it
        run: command -v sqlite3 >/dev/null || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Quality gates
        run: ./dev test
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-ai-results
          path: .test-ai-results/
          include-hidden-files: true
