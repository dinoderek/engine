name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA; Dependabot bumps them (docs/versions.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go from go.mod's toolchain line, the same one ./dev pins.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The tmux tests skip without tmux, and CI must never skip.
      - name: Install tmux if the runner lacks it
        run: command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
      - name: Quality gates
        run: ./dev test
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-ai-results
          path: .test-ai-results/
          include-hidden-files: true
