<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f5bd3">
<title>engine</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script src="/dom.js" defer></script>
<script src="/writes.js" defer></script>
<script src="/control.js" defer></script>
<script src="/panel.js" defer></script>
<script src="/sessions.js" defer></script>
<script src="/inbox.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar" id="bar">
  <span class="brand">engine</span>
  <nav aria-label="Views"><a class="tab" id="tab-inbox" href="#/inbox" aria-current="page">Inbox</a><a class="tab" id="tab-plans" href="#/plans">Plans</a><a class="tab" id="tab-sessions" href="#/sessions">Sessions</a></nav>
  <span class="status" id="status" role="status" aria-live="polite"></span>
</header>
<main class="plans" id="workspace">
  <section class="inbox" id="inbox" aria-label="Inbox" tabindex="-1">
    <h1 class="inbox-head" id="inbox-head">Inbox</h1>
    <p class="banner" id="inbox-banner" hidden></p>
    <p class="empty" id="inbox-empty">Loading inbox…</p>
    <ul class="cards" id="cards"></ul>
  </section>
  <section class="list" id="list" aria-labelledby="plans-heading" hidden>
    <h1 id="plans-heading" class="visually-hidden">Plans</h1>
    <input id="search" type="search" placeholder="Search repo, title or ID" aria-label="Search repo, title or ID" autocomplete="off">
    <div class="filters">
      <label>Repo <select id="repo"><option value="">All</option></select></label>
      <label>State <select id="state"><option value="">All</option></select></label>
    </div>
    <ul id="plans" class="plan-list"></ul>
  </section>
  <section class="pane" id="pane" aria-label="Tasks" tabindex="-1" hidden>
    <p class="empty">Select a plan to see its tasks.</p>
  </section>
  <section class="sessions" id="sessions" aria-label="Sessions" tabindex="-1" hidden>
    <p class="empty">Loading sessions…</p>
  </section>
  <aside class="panel" id="panel" aria-labelledby="panel-title" hidden>
    <div class="panel-top">
      <span class="meta" id="panel-ref"></span>
      <button type="button" id="panel-close">Close</button>
    </div>
    <h2 id="panel-title" tabindex="-1"></h2>
    <div class="muted" id="panel-state"></div>
    <div id="panel-actions"></div>
    <p class="banner" id="panel-banner" hidden></p>
    <div role="tablist" aria-label="Item views" id="tabs">
      <button type="button" role="tab" id="tab-description" aria-controls="view-description" aria-selected="true" tabindex="0">Description</button>
      <button type="button" role="tab" id="tab-communications" aria-controls="view-communications" aria-selected="false" tabindex="-1">Communications</button>
    </div>
    <div role="tabpanel" id="view-description" aria-labelledby="tab-description" class="markdown"></div>
    <div role="tabpanel" id="view-communications" aria-labelledby="tab-communications" hidden>
      <p class="empty" id="thread-note"></p>
      <p class="empty" id="thread-empty" hidden>No messages yet.</p>
      <ol class="messages" id="messages"></ol>
      <button type="button" id="more" hidden>Load more messages</button>
    </div>
  </aside>
</main>
<div class="sheet-back" id="sheet-back" hidden>
  <div class="sheet" id="sheet" role="alertdialog" aria-modal="true" aria-labelledby="sheet-title" aria-describedby="sheet-effect"></div>
</div>
</body>
</html>
