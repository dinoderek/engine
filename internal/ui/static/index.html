<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engine</title>
<link rel="stylesheet" href="/app.css">
<script src="/dom.js" defer></script>
<script src="/panel.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <span class="brand">engine</span>
  <nav aria-label="Views"><a class="tab" href="#/plans" aria-current="page">Plans</a></nav>
  <span class="status" id="status" role="status" aria-live="polite"></span>
</header>
<main class="plans" id="workspace">
  <section class="list" id="list" aria-labelledby="plans-heading">
    <h1 id="plans-heading" class="visually-hidden">Plans</h1>
    <input id="search" type="search" placeholder="Search repo, title or ID" aria-label="Search repo, title or ID" autocomplete="off">
    <div class="filters">
      <label>Repo <select id="repo"><option value="">All</option></select></label>
      <label>State <select id="state"><option value="">All</option></select></label>
    </div>
    <ul id="plans" class="plan-list"></ul>
  </section>
  <section class="pane" id="pane" aria-label="Tasks" tabindex="-1">
    <p class="empty">Select a plan to see its tasks.</p>
  </section>
  <aside class="panel" id="panel" aria-labelledby="panel-title" hidden>
    <div class="panel-top">
      <span class="meta" id="panel-ref"></span>
      <button type="button" id="panel-close">Close</button>
    </div>
    <h2 id="panel-title" tabindex="-1"></h2>
    <div class="muted" id="panel-state"></div>
    <p class="banner" id="panel-banner" hidden></p>
    <div role="tablist" aria-label="Item views" id="tabs">
      <button type="button" role="tab" id="tab-description" aria-controls="view-description" aria-selected="true" tabindex="0">Description</button>
      <button type="button" role="tab" id="tab-communications" aria-controls="view-communications" aria-selected="false" tabindex="-1">Communications</button>
    </div>
    <div role="tabpanel" id="view-description" aria-labelledby="tab-description" class="markdown"></div>
    <div role="tabpanel" id="view-communications" aria-labelledby="tab-communications" hidden>
      <p class="empty" id="thread-note"></p>
      <p class="empty" id="thread-empty" hidden>No messages yet.</p>
      <ol class="messages" id="messages"></ol>
      <button type="button" id="more" hidden>Load more messages</button>
    </div>
  </aside>
</main>
</body>
</html>
